<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bài 7 - Thêm nút con bằng appendChild</title>
</head>
<body>

    <h2>Kết quả sau khi thêm sách mới vào XML DOM</h2>
    <p><strong>Chuỗi XML ban đầu:</strong></p>
    <pre id="xml-before" style="background: #f9f9f9; padding: 10px; border: 1px solid #ddd;"></pre>

    <p><strong>Chuỗi XML sau khi appendChild:</strong></p>
    <pre id="xml-after" style="background: #f4f4f4; padding: 10px; border: 1px solid #ddd;"></pre>

<script>

    const xmlString = `<bookstore>
    <book>
        <title>Lập trình JavaScript nâng cao</title>
        <price>25.50</price>
    </book>
</bookstore>`;


    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
    }

    document.getElementById("xml-before").innerHTML = escapeHtml(xmlString);


    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(xmlString, "application/xml");

    const parserError = xmlDoc.querySelector("parsererror");
    if (parserError) {
        console.error("Lỗi khi phân tích chuỗi XML!");
    } else {
        const newBook = xmlDoc.createElement("book");

        const newTitle = xmlDoc.createElement("title");
        newTitle.textContent = "Học XML và DOM trong Web";

        const newPrice = xmlDoc.createElement("price");
        newPrice.textContent = "35.00";
        newBook.appendChild(newTitle);
        newBook.appendChild(newPrice);
        const bookstoreNode = xmlDoc.documentElement;
        bookstoreNode.appendChild(newBook);
        const serializer = new XMLSerializer();
        const updatedXmlString = serializer.serializeToString(xmlDoc);
        console.log("XML sau khi thêm:\n", updatedXmlString);
        document.getElementById("xml-after").innerHTML = escapeHtml(updatedXmlString);
    }
</script>

</body>
</html>
